name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'apps/kf_be/**'
            frontend:
              - 'apps/kf_fe/**'
            docker:
              - 'docker-compose.yml'
              - 'docker-compose.prod.yml'
              - '.dockerignore'
              - '.github/workflows/**'

  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.docker == 'true'
    defaults:
      run:
        working-directory: apps/kf_be
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: apps/kf_be/pom.xml
      - run: mvn -B -ntp test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.docker == 'true'
    defaults:
      run:
        working-directory: apps/kf_fe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: apps/kf_fe/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn build

  docker:
    name: Docker Compose
    runs-on: ubuntu-latest
    needs:
      - changes
      - backend
      - frontend
    if: always() && needs.changes.outputs.docker == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example config --quiet
      - run: NEXT_PUBLIC_API_URL=http://localhost:3398 docker compose --env-file .env.example -f docker-compose.prod.yml config --quiet
