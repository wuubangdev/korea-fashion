services:
  backend:
    build:
      context: .
      dockerfile: apps/kf_be/Dockerfile
    image: kor-fashion-backend:prod
    container_name: kf_backend
    restart: unless-stopped
    user: root
    environment:
      SPRING_APPLICATION_NAME: kf
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://host.docker.internal:3399/korea_fashion?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-your_mysql_user}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-your_mysql_password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL:-false}
      SPRING_JPA_FORMAT_SQL: ${SPRING_JPA_FORMAT_SQL:-false}
      KF_MEDIA_SCHEMA_INITIALIZER_ENABLED: ${KF_MEDIA_SCHEMA_INITIALIZER_ENABLED:-false}
      SPRINGDOC_API_DOCS_GROUPS_ENABLED: ${SPRINGDOC_API_DOCS_GROUPS_ENABLED:-true}
      SPRINGDOC_SWAGGER_UI_DISABLE_SWAGGER_DEFAULT_URL: ${SPRINGDOC_SWAGGER_UI_DISABLE_SWAGGER_DEFAULT_URL:-true}
      SPRINGDOC_SWAGGER_UI_URLS_PRIMARY_NAME: ${SPRINGDOC_SWAGGER_UI_URLS_PRIMARY_NAME:-02-admin-private}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-prod-change-me-long-random-jwt-secret}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-https://sieunhon.top,https://www.sieunhon.top,http://sieunhon.top,http://www.sieunhon.top}
      KF_MEDIA_STORAGE_DIR: ${KF_MEDIA_STORAGE_DIR:-/app/uploads}
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:-100MB}
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:-120MB}
      SERVER_FORWARD_HEADERS_STRATEGY: ${SERVER_FORWARD_HEADERS_STRATEGY:-framework}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      CHATBOT_RATE_LIMIT_HOURLY: ${CHATBOT_RATE_LIMIT_HOURLY:-20}
      CHATBOT_RATE_LIMIT_DAILY: ${CHATBOT_RATE_LIMIT_DAILY:-80}
    ports:
      - "${BACKEND_BIND_HOST:-127.0.0.1}:${BACKEND_PORT:-3398}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./uploads:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: apps/kf_fe/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.sieunhon.top}
    image: kor-fashion-frontend:prod
    container_name: kf_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.sieunhon.top}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-prod-change-me-revalidate-secret}
    ports:
      - "${FRONTEND_BIND_HOST:-127.0.0.1}:${FRONTEND_PORT:-3397}:3000"
    depends_on:
      - backend
