services:
  db:
    image: mysql:8.4
    container_name: kf_db
    environment:
      MYSQL_DATABASE: ${LOCAL_MYSQL_DATABASE:-kf}
      MYSQL_USER: ${LOCAL_MYSQL_USER:-kf}
      MYSQL_PASSWORD: ${LOCAL_MYSQL_PASSWORD:-kf_password}
      MYSQL_ROOT_PASSWORD: ${LOCAL_MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "${LOCAL_MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/kf_be/Dockerfile
    image: kor-fashion-backend:local
    container_name: kf_backend
    environment:
      SPRING_APPLICATION_NAME: kf
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://db:3306/kf?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-kf}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-kf_password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL:-false}
      SPRING_JPA_FORMAT_SQL: ${SPRING_JPA_FORMAT_SQL:-false}
      KF_MEDIA_SCHEMA_INITIALIZER_ENABLED: ${KF_MEDIA_SCHEMA_INITIALIZER_ENABLED:-false}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-local-dev-change-me-long-random-jwt-secret}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-*}
      SERVER_FORWARD_HEADERS_STRATEGY: ${SERVER_FORWARD_HEADERS_STRATEGY:-framework}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      CHATBOT_RATE_LIMIT_HOURLY: ${CHATBOT_RATE_LIMIT_HOURLY:-20}
      CHATBOT_RATE_LIMIT_DAILY: ${CHATBOT_RATE_LIMIT_DAILY:-80}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: .
      dockerfile: apps/kf_fe/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://103.173.66.91:3398}
    image: kor-fashion-frontend:local
    container_name: kf_frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://103.173.66.91:3398}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-local-dev-revalidate-secret}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  mysql_data:
