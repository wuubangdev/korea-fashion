services:
  db:
    image: mysql:8.4
    container_name: kf_db
    environment:
      MYSQL_DATABASE: ${LOCAL_MYSQL_DATABASE:-kf}
      MYSQL_USER: ${LOCAL_MYSQL_USER:-kf}
      MYSQL_PASSWORD: ${LOCAL_MYSQL_PASSWORD:-kf_password}
      MYSQL_ROOT_PASSWORD: ${LOCAL_MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "${LOCAL_MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/kf_be/Dockerfile
    image: kor-fashion-backend:local
    container_name: kf_backend
    environment:
      SPRING_APPLICATION_NAME: kf
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      KF_MEDIA_SCHEMA_INITIALIZER_ENABLED: ${KF_MEDIA_SCHEMA_INITIALIZER_ENABLED:-false}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-*}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: .
      dockerfile: apps/kf_fe/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://103.173.66.91:3398}
    image: kor-fashion-frontend:local
    container_name: kf_frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://103.173.66.91:3398}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  mysql_data:
